<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wishlist | Local Book Exchange</title>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/user.css" />
  </head>

  <body class="user-layout">
    <header class="user-topbar">
      <a href="dashboard.html" class="user-logo">
        <img src="../assets/images/logo.png" alt="Logo" />

        <span> Local Book Exchange </span>
      </a>

      <nav class="user-nav">
        <a href="dashboard.html"> Dashboard </a>

        <a href="browse-books.html"> Browse Books </a>

        <a href="my-books.html"> My Books </a>

        <a href="my-exchanges.html"> Exchanges </a>

        <a href="messages.html"> Messages </a>
      </nav>

      <div class="user-actions">
        <a
          href="wishlist.html"
          class="nav-icon"
          style="background: #182017; color: white"
        >
          ❤️
        </a>

        <a href="profile.html">
          <img
            src="../assets/images/logo.png"
            class="profile-avatar"
            alt="Profile"
          />
        </a>
      </div>
    </header>

    <main class="user-dashboard">
      <section class="page-section">
        <div class="page-header">
          <div>
            <h1>My Wishlist</h1>

            <p>Books you have saved for later.</p>
          </div>

          <a href="browse-books.html" class="btn btn-dark"> Browse Books </a>
        </div>

        <div class="card">
          <div class="form-row">
            <div class="form-group">
              <label for="wishlistSearch"> Search Wishlist </label>

              <input
                type="search"
                id="wishlistSearch"
                class="form-control"
                placeholder="Search saved books..."
              />
            </div>

            <div class="form-group">
              <label for="wishlistCategory"> Category </label>

              <select id="wishlistCategory" class="form-control">
                <option value="">All Categories</option>
              </select>
            </div>
          </div>
        </div>

        <br />

        <div class="page-header">
          <div>
            <h2>Saved Books</h2>

            <p>
              <span id="wishlistBookCount"> 0 </span>
              saved books
            </p>
          </div>
        </div>

        <div class="book-grid" id="wishlistGrid">
          <div class="empty-state">
            <img
              src="../assets/images/book-placeholder.svg"
              alt="Empty Wishlist"
            />

            <h3>Your wishlist is empty</h3>

            <p>Save books you are interested in exchanging.</p>

            <a href="browse-books.html" class="btn btn-dark"> Find Books </a>
          </div>
        </div>
      </section>
    </main>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/user.js"></script>
  </body>
</html>
