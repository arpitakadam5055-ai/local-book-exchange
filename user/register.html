<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Register | Local Book Exchange</title>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/user.css" />
  </head>

  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <img src="../assets/images/logo.png" alt="Local Book Exchange" />
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">Join your local book exchange community</p>

        <div id="registerMessage"></div>

        <form id="registerForm">
          <div class="form-group">
            <label for="fullName">Full Name</label>

            <input
              type="text"
              id="fullName"
              name="fullName"
              class="form-control"
              placeholder="Enter your full name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>

            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="Enter your email"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>

            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-control"
              placeholder="Enter phone number"
            />
          </div>

          <div class="form-group">
            <label for="location">Location</label>

            <input
              type="text"
              id="location"
              name="location"
              class="form-control"
              placeholder="Example: Karad, Maharashtra"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Create password"
              minlength="6"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-control"
              placeholder="Confirm password"
              minlength="6"
              required
            />
          </div>

          <button type="submit" class="btn btn-dark btn-full">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          <p>
            Already have an account?
            <a href="login.html">Login</a>
          </p>

          <br />

          <p>
            <a href="../index.html">← Back to Home</a>
          </p>
        </div>
      </div>
    </div>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/auth.js"></script>
  </body>
</html>
